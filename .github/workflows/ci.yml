name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Os testes primeiro: sao eles que prendem os numeros das tabelas.
      - name: Testes
        run: dotnet test testes/CuboSoma.Testes/CuboSoma.Testes.csproj -c Release --nologo

      - name: Os policubos, e as sete pecas que sobram
        run: dotnet run --project ferramentas/Medidor/Medidor.csproj -c Release -- policubos

      - name: As sete pecas, com simetrias e colocacoes
        run: dotnet run --project ferramentas/Medidor/Medidor.csproj -c Release -- pecas

      - name: As montagens do cubo e a divisao pelas 48 simetrias
        run: dotnet run --project ferramentas/Medidor/Medidor.csproj -c Release -- cubo

      - name: As caixas de 27 celulas
        run: dotnet run --project ferramentas/Medidor/Medidor.csproj -c Release -- caixas

      - name: Qual peca ocupa o centro do cubo
        run: dotnet run --project ferramentas/Medidor/Medidor.csproj -c Release -- centro
